# Sobe tudo com: cp .env.example .env && docker compose up --build
# Credenciais abaixo são locais e descartáveis (vêm do .env da raiz).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nobre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nobre}
      POSTGRES_DB: ${POSTGRES_DB:-nobre_crm}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nobre}:${POSTGRES_PASSWORD:-nobre}@postgres:5432/${POSTGRES_DB:-nobre_crm}
      PORT: 3333
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:3000
      REFERENCE_DATE: ${REFERENCE_DATE:-}
      FOLLOWUP_CRON: ${FOLLOWUP_CRON:-0 * * * *}
      FOLLOWUP_WEBHOOK_URL: ${FOLLOWUP_WEBHOOK_URL:-}
      LOG_LEVEL: info
      NODE_ENV: production
    command: sh -c "pnpm prisma migrate deploy && pnpm prisma db seed && pnpm start"
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3333
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata: {}
